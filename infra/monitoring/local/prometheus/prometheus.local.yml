global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hrtech-backend-local"
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - "host.docker.internal:3175"

  - job_name: "hrtech-audit-worker-local"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8001"

  - job_name: "hrtech-node-exporter-local"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "prometheus-local"
    static_configs:
      - targets:
          - "prometheus:9090"