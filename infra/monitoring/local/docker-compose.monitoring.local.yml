services:
  prometheus:
    image: prom/prometheus:latest
    container_name: hrtech-prometheus-local
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - market-network

  loki:
    image: grafana/loki:latest
    container_name: hrtech-loki-local
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki.local.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - market-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: hrtech-node-exporter-local
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - market-network

  grafana:
    image: grafana/grafana:latest
    container_name: hrtech-grafana-local
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_local_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
      - node-exporter
    networks:
      - market-network

volumes:
  grafana_local_data:
    name: hrtech-grafana-local-data

networks:
  market-network:
    external: true